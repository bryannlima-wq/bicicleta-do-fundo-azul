
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMX Azul 3D</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #82c9ec;
}

canvas {
    display: block;
}

#hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    color: white;
    text-shadow: 1px 2px 4px #123b52;
}

#titulo {
    text-align: center;
    margin-top: 15px;
    font-size: 23px;
    font-weight: bold;
    letter-spacing: 3px;
}

#controles {
    text-align: center;
    margin-top: 10px;
    line-height: 1.8;
    font-size: 13px;
}

#status {
    position: absolute;
    left: 15px;
    top: 15px;
    background: #063956dd;
    border: 1px solid #78e6ff;

    line-height: 1.8;
}

#mensagem {
    position: absolute;
    bottom: 35px;
    left: 50%;

}

}

#telaInicial {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #052a438c;
}

#painel {
    width: min(90%, 470px);
    padding: 30px;
    text-align: center;
    color: white;
    background: #073b59f5;
    border: 1px solid #75e4ff;
    border-radius: 20px;
    box-shadow: 0 15px 50px #00152188;
}

#painel h1 {
    color: #ffdf48;
}

#painel p {
    line-height: 1.7;
}

@media(max-width: 600px) {
    #titulo {
        font-size: 17px;
    }

    #controles {

    }
}
</style>
</head>

<body>

<div id="hud">
    <div id="titulo">BMX AZUL 3D</div>

    <div id="controles">
        WASD ou SETAS: movimentar a bicicleta<br>
        ESPAÇO: pular · Mouse: olhar ao redor
    </div>

    <div id="status">
        ⭐ Esferas: <b id="pontuacao">0</b> / 12<br>
        🚲 Velocidade: <b id="velocidade">0</b> km/h
    </div>

    <div id="mensagem"></div>

    <button id="reiniciar" onclick="reiniciarJogo()">
        ↻ Reiniciar
    </button>
</div>

<div id="telaInicial">
    <div id="painel">
        <h1>🚲 BMX AZUL 3D</h1>

        <p>
            Explore uma arena azul em 3D, pule rampas,
            suba escadas e colete as esferas verdes!
        </p>

        <p>
            <b>WASD / Setas:</b> movimentar<br>
            <b>Espaço:</b> pular<br>
            <b>Mouse:</b> olhar ao redor
        </p>

        <button id="iniciar">COMEÇAR A PEDALAR</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
// ==================================================
// CONFIGURAÇÃO DO JOGO
// ==================================================

let cena, camera, renderizador, relogio;
let jogador, bicicleta, rodaDianteira, rodaTraseira;

let teclas = {};
let velocidadeY = 0;
let noChao = true;
let espacoAnterior = false;
let direcao = Math.PI;
let iniciado = false;
let pontos = 0;

let esferas = [];
let colisores = []; // Caixas sólidas do cenário para detectar colisões
let mensagemTempo = 0;

const pontuacaoHTML = document.getElementById("pontuacao");
const velocidadeHTML = document.getElementById("velocidade");
const mensagemHTML = document.getElementById("mensagem");

// Materiais do cenário
const materialAzul = new THREE.MeshStandardMaterial({
    color: 0x15517a,
    roughness: 0.85
});

const materialTopo = new THREE.MeshStandardMaterial({
    color: 0x91c9e2,
    roughness: 0.8
});

const materialEscuro = new THREE.MeshStandardMaterial({
    color: 0x0a3554,
    roughness: 0.8
});

const materialPreto = new THREE.MeshStandardMaterial({
    color: 0x15191d,
    metalness: 0.35,
    roughness: 0.4
});

const materialMetal = new THREE.MeshStandardMaterial({
    color: 0x777f86,
    metalness: 0.7,
    roughness: 0.3
});

const materialAmarelo = new THREE.MeshStandardMaterial({
    color: 0xffd52f,
    metalness: 0.25,
    roughness: 0.35
});

const materialPneu = new THREE.MeshStandardMaterial({
    color: 0x101318,
    roughness: 0.8
});

const materialVerde = new THREE.MeshStandardMaterial({
    color: 0xb9ed86,
    emissive: 0x284b0c,
    roughness: 0.4
});

const materialBranco = new THREE.MeshStandardMaterial({
    color: 0xd7f2ff
});

// ==================================================
// FUNÇÕES PARA CRIAR OBJETOS 3D
// ==================================================

function criarCaixa(l, a, p, material, x, y, z, pai = cena) {
    const geometria = new THREE.BoxGeometry(l, a, p);
    const objeto = new THREE.Mesh(geometria, material);

    objeto.position.set(x, y, z);
    objeto.castShadow = true;
    objeto.receiveShadow = true;

    pai.add(objeto);

    // Registra caixas grandes do cenário como obstáculos sólidos.
    // Não registra peças da bicicleta nem pequenos detalhes decorativos.
    if (pai === cena && Math.max(l, a, p) > 0.5) {
        colisores.push({
            minX: x - l / 2,
            maxX: x + l / 2,
            minY: y - a / 2,
            maxY: y + a / 2,
            minZ: z - p / 2,
            maxZ: z + p / 2
        });
    }

    return objeto;
}

function criarEsfera(raio, material, x, y, z, pai = cena) {
    const objeto = new THREE.Mesh(
        new THREE.SphereGeometry(raio, 16, 12),
        material
    );

    objeto.position.set(x, y, z);
    objeto.castShadow = true;

    pai.add(objeto);
    return objeto;
}

function criarCilindroEntre(a, b, raio, material, pai) {
    const direcao = new THREE.Vector3().subVectors(b, a);
    const comprimento = direcao.length();

    const objeto = new THREE.Mesh(
        new THREE.CylinderGeometry(raio, raio, comprimento, 10),
        material
    );

    objeto.position.copy(a).add(b).multiplyScalar(0.5);

    objeto.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direcao.normalize()
    );

    objeto.castShadow = true;
    pai.add(objeto);

    return objeto;
}

// ==================================================
// CONSTRUIR A BICICLETA
// ==================================================

function criarBicicleta() {
    bicicleta = new THREE.Group();
    jogador.add(bicicleta);

    function tubo(a, b, raio = 0.035, material = materialPreto, pai = bicicleta) {
        return criarCilindroEntre(a, b, raio, material, pai);
    }

    // Centros das rodas: frente fica no eixo Z negativo.
    const traseira = new THREE.Vector3(0, 0.63, 0.78);
    const dianteira = new THREE.Vector3(0, 0.63, -0.88);

    // Quadro BMX.
    const pedal = new THREE.Vector3(0, 0.57, 0.08);
    const banco = new THREE.Vector3(0, 1.04, 0.37);
    const cabeca = new THREE.Vector3(0, 1.00, -0.48);
    const garfo = new THREE.Vector3(0, 0.70, -0.78);

    tubo(traseira, pedal, 0.04);
    tubo(pedal, banco, 0.04);
    tubo(banco, cabeca, 0.045);
    tubo(cabeca, garfo, 0.04);
    tubo(garfo, pedal, 0.04);
    tubo(pedal, traseira, 0.04);

    // Detalhe amarelo no quadro.
    tubo(
        new THREE.Vector3(0.047, 0.86, 0.24),
        new THREE.Vector3(0.047, 0.78, -0.30),
        0.012,
        materialAmarelo
    );

    // Canote e banco.
    tubo(
        new THREE.Vector3(0, 0.96, 0.37),
        new THREE.Vector3(0, 1.12, 0.37),
        0.025,
        materialMetal
    );
    criarCaixa(0.22, 0.055, 0.34, materialPreto, 0, 1.14, 0.39, bicicleta);

    // Coluna e guidão: ficam na frente do banco, ligados à roda dianteira.
    tubo(
        new THREE.Vector3(0, 1.00, -0.48),
        new THREE.Vector3(0, 1.27, -0.68),
        0.035,
        materialMetal
    );
    tubo(
        new THREE.Vector3(-0.43, 1.27, -0.68),
        new THREE.Vector3(0.43, 1.27, -0.68),
        0.035,
        materialPreto
    );

    // Manoplas nas duas pontas do guidão.
    for (const lado of [-1, 1]) {
        tubo(
            new THREE.Vector3(lado * 0.34, 1.27, -0.68),
            new THREE.Vector3(lado * 0.47, 1.27, -0.68),
            0.045,
            materialPreto
        );
    }

    // Eixo, braços e pedais.
    tubo(
        new THREE.Vector3(-0.13, 0.57, 0.08),
        new THREE.Vector3(0.13, 0.57, 0.08),
        0.025,
        materialMetal
    );
    tubo(
        new THREE.Vector3(-0.13, 0.57, 0.08),
        new THREE.Vector3(-0.13, 0.57, 0.28),
        0.018,
        materialMetal
    );
    tubo(
        new THREE.Vector3(0.13, 0.57, 0.08),
        new THREE.Vector3(0.13, 0.57, -0.12),
        0.018,
        materialMetal
    );
    criarCaixa(0.20, 0.045, 0.07, materialPreto, -0.13, 0.57, 0.28, bicicleta);
    criarCaixa(0.20, 0.045, 0.07, materialPreto, 0.13, 0.57, -0.12, bicicleta);

    // Rodas com pneus pretos, aros amarelos e raios metálicos.
    function criarRoda(z) {
        const grupo = new THREE.Group();
        grupo.position.set(0, 0.63, z);
        bicicleta.add(grupo);

        const pneu = new THREE.Mesh(
            new THREE.TorusGeometry(0.43, 0.065, 12, 40),
            materialPneu
        );
        pneu.rotation.y = Math.PI / 2;
        pneu.castShadow = true;
        grupo.add(pneu);

        const aro = new THREE.Mesh(
            new THREE.TorusGeometry(0.345, 0.018, 8, 40),
            materialAmarelo
        );
        aro.rotation.y = Math.PI / 2;
        grupo.add(aro);

        // Cubo atravessando a roda pelo eixo lateral.
        const cubo = new THREE.Mesh(
            new THREE.CylinderGeometry(0.045, 0.045, 0.15, 12),
            materialMetal
        );
        cubo.rotation.z = Math.PI / 2;
        grupo.add(cubo);

        // Raios dos dois lados, distribuídos ao redor do aro.
        for (const lado of [-1, 1]) {
            for (let i = 0; i < 12; i++) {
                const angulo = (i / 12) * Math.PI * 2;
                const pontoA = new THREE.Vector3(
                    lado * 0.055,
                    Math.sin(angulo) * 0.335,
                    Math.cos(angulo) * 0.335
                );
                const pontoB = new THREE.Vector3(lado * 0.055, 0, 0);
                tubo(pontoA, pontoB, 0.006, materialMetal, grupo);
            }
        }
        return grupo;
    }

    rodaTraseira = criarRoda(traseira.z);
    rodaDianteira = criarRoda(dianteira.z);

    // Corrente simplificada na lateral direita.
    tubo(
        new THREE.Vector3(0.105, 0.57, 0.08),
        new THREE.Vector3(0.105, 0.63, 0.78),
        0.009,
        materialMetal
    );
    tubo(
        new THREE.Vector3(0.105, 0.63, 0.78),
        new THREE.Vector3(0.105, 0.57, 0.08),
        0.009,
        materialMetal
    );
}

// ==================================================
// CONSTRUIR O CENÁRIO AZUL
// ==================================================

function criarCenario() {
    // Chão
    criarCaixa(
        100, 0.5, 100,
        materialTopo,
        0, -0.28, 0
    );

    // Grade quadriculada no chão
    const grade = new THREE.GridHelper(
        100, 100, 0xd9f5ff, 0x70a9c6
    );

    grade.position.y = -0.015;
    cena.add(grade);

    // Paredes da arena
    function parede(l, a, p, x, y, z) {
        criarCaixa(l, a, p, materialAzul, x, y, z);

        criarCaixa(
            l + 0.03, 0.12, p + 0.03,
            materialTopo,
            x, y + a / 2, z
        );
    }

    parede(100, 9, 1, 0, 4.2, -28);
    parede(100, 9, 1, 0, 4.2, 28);
    parede(1, 9, 56, -49.5, 4.2, 0);
    parede(1, 9, 56, 49.5, 4.2, 0);

    // Linhas claras nas paredes, simulando os azulejos
    for (let x = -48; x <= 48; x += 2) {
        for (let y = 0.5; y <= 8; y += 1.2) {
            criarCaixa(0.035, 0.035, 0.035, materialBranco, x, y, -27.47);
            criarCaixa(0.035, 0.035, 0.035, materialBranco, x, y, 27.47);
        }
    }

    for (let z = -26; z <= 26; z += 2) {
        for (let y = 0.5; y <= 8; y += 1.2) {
            criarCaixa(0.035, 0.035, 0.035, materialBranco, -48.97, y, z);
            criarCaixa(0.035, 0.035, 0.035, materialBranco, 48.97, y, z);
        }
    }

    // Plataforma elevada à esquerda
    criarCaixa(15, 0.7, 5, materialAzul, -17, 0.4, -7);
    criarCaixa(15, 0.12, 5, materialTopo, -17, 0.82, -7);

    // Rampa inclinada
    const rampa = new THREE.Mesh(
        new THREE.BoxGeometry(5, 0.35, 16),
        materialTopo
    );

    rampa.position.set(-7, 1.1, -5);
    rampa.rotation.x = -0.14;
    rampa.rotation.z = -0.15;
    rampa.castShadow = true;
    rampa.receiveShadow = true;
    cena.add(rampa);

    // Plataforma do fundo
    criarCaixa(11, 0.6, 5, materialAzul, 1, 0.5, -13);
    criarCaixa(11, 0.12, 5, materialTopo, 1, 0.86, -13);

    // Grande obstáculo central
    criarCaixa(8, 3.5, 7, materialEscuro, 7, 1.75, 0);
    criarCaixa(8.15, 0.14, 7.15, materialTopo, 7, 3.55, 0);

    // Escadas
    for (let i = 0; i < 9; i++) {
        const altura = 0.22 * (i + 1);
        const x = -1 + i * 0.14;
        const z = 8 - i * 0.85;

        criarCaixa(
            2.5, altura, 0.72,
            materialAzul,
            x, altura / 2, z
        );

        criarCaixa(
            2.5, 0.08, 0.72,
            materialTopo,
            x, altura + 0.04, z
        );
    }

    // Plataformas circulares e colunas
    const plataformas = [
        { x: -25, z: 9 },
        { x: 23, z: -15 },
        { x: 28, z: 12 }
    ];

    plataformas.forEach(p => {
        const base = new THREE.Mesh(
            new THREE.CylinderGeometry(4, 4, 0.5, 32),
            materialAzul
        );

        base.position.set(p.x, 0.15, p.z);
        cena.add(base);

        const topo = new THREE.Mesh(
            new THREE.CylinderGeometry(4, 4, 0.1, 32),
            materialTopo
        );

        topo.position.set(p.x, 0.45, p.z);
        cena.add(topo);

        for (let i = 0; i < 4; i++) {
            criarCaixa(
                0.65, 2.5, 0.65,
                materialAzul,
                p.x - 1.5 + i,
                1.5,
                p.z
            );
        }
    });

    // Blocos espalhados como obstáculos
    for (let i = 0; i < 12; i++) {
        const x = ((i * 13) % 53) - 26;
        const z = ((i * 17) % 47) - 23;

        if (Math.abs(x) < 5 && Math.abs(z) < 5) {
            continue;
        }

        const altura = 0.6 + (i % 3) * 0.4;

        criarCaixa(
            1.1, altura, 1.1,
            materialAzul,
            x, altura / 2, z
        );
    }

    // Esferas verdes que o jogador precisa coletar
    const posicoes = [
        [-18, 1.4, 3],
        [-13, 1.1, 15],
        [-6, 0.9, -18],
        [3, 1.1, 16],
        [13, 1.2, 14],
        [18, 0.9, 4],
        [24, 1.1, -7],
        [12, 1.2, -21],
        [-25, 1.2, -10],
        [-30, 1.2, 1],
        [0, 1.1, 2],
        [31, 1.1, 0]
    ];

    posicoes.forEach((p, i) => {
        const grupo = new THREE.Group();
        grupo.position.set(p[0], p[1], p[2]);
        cena.add(grupo);

        criarEsfera(0.36, materialVerde, 0, 0, 0, grupo);

        const aro = new THREE.Mesh(
            new THREE.TorusGeometry(0.48, 0.045, 8, 24),
            materialAmarelo
        );

        aro.rotation.x = Math.PI / 2;
        grupo.add(aro);

        esferas.push({
            grupo: grupo,
            altura: p[1],
            fase: i * 0.8,
            coletada: false
        });
    });
}

// ==================================================
// INICIAR O MOTOR 3D
// ==================================================

function iniciarMotor() {
    cena = new THREE.Scene();

    cena.background = new THREE.Color(0x88cfee);
    cena.fog = new THREE.Fog(0x88cfee, 40, 100);

    camera = new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.1,
        250
    );

    renderizador = new THREE.WebGLRenderer({
        antialias: true
    });

    renderizador.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderizador.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

    renderizador.shadowMap.enabled = true;
    renderizador.shadowMap.type = THREE.PCFSoftShadowMap;

    document.body.appendChild(renderizador.domElement);

    // Luz ambiente
    cena.add(
        new THREE.HemisphereLight(
            0xdff7ff,
            0x28536e,
            2.1
        )
    );

    // Sol e sombras
    const sol = new THREE.DirectionalLight(0xffffff, 2.1);
    sol.position.set(-15, 30, 10);
    sol.castShadow = true;
    sol.shadow.mapSize.set(2048, 2048);
    cena.add(sol);

    criarCenario();

    // Jogador: a bicicleta é a representação visual dele
    jogador = new THREE.Group();
    cena.add(jogador);

    criarBicicleta();

    jogador.position.set(0, 0, 18);
    direcao = Math.PI;

    relogio = new THREE.Clock();

    window.addEventListener("resize", redimensionar);
    animar();
}

function redimensionar() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

    renderizador.setSize(
        window.innerWidth,
        window.innerHeight
    );
}

// ==================================================
// MENSAGENS E REINÍCIO
// ==================================================

function mostrarMensagem(texto) {
    mensagemHTML.textContent = texto;
    mensagemHTML.style.opacity = 1;
    mensagemTempo = 2;
}

function reiniciarJogo() {
    pontos = 0;
    pontuacaoHTML.textContent = "0";
    velocidadeHTML.textContent = "0";

    esferas.forEach(e => {
        e.coletada = false;
        e.grupo.visible = true;
    });

    jogador.position.set(0, 0, 18);
    jogador.rotation.set(0, 0, 0);

    direcao = Math.PI;
    velocidadeY = 0;
    noChao = true;

    mostrarMensagem("Bora pedalar!");
}

// ==================================================
// ATUALIZAÇÃO E MOVIMENTAÇÃO
// ==================================================

function animar() {
    requestAnimationFrame(animar);

    const dt = Math.min(relogio.getDelta(), 0.035);

    if (!iniciado) {
        renderizador.render(cena, camera);
        return;
    }

    // W/S ou setas para frente e para trás
    const frente =
        (teclas["KeyW"] || teclas["ArrowUp"] ? 1 : 0) -
        (teclas["KeyS"] || teclas["ArrowDown"] ? 1 : 0);

    // A/D ou setas para virar
    const lado =
        (teclas["KeyD"] || teclas["ArrowRight"] ? 1 : 0) -
        (teclas["KeyA"] || teclas["ArrowLeft"] ? 1 : 0);

    // Direção corrigida: A / seta esquerda vira à esquerda;
    // D / seta direita vira à direita. Ao andar de ré, a direção se inverte.
    if (lado !== 0) {
        direcao -= lado * 1.8 * dt * (frente < 0 ? -1 : 1);
    }

    // Movimento para frente ou para trás
    const velocidade = 10;

    const alvoX = -Math.sin(direcao) * frente * velocidade;
    const alvoZ = -Math.cos(direcao) * frente * velocidade;

    // Física simples de colisão: testa o movimento em X e Z separadamente.
    // Isso permite deslizar ao longo de uma parede em vez de atravessá-la.
    const raioColisao = 0.58;
    const alturaBicicleta = 1.35;

    function colideComCenario(x, y, z) {
        const jogadorMinY = y;
        const jogadorMaxY = y + alturaBicicleta;

        return colisores.some(c => {
            // Só colide com objetos que estejam na mesma altura da bicicleta.
            const sobrepoeVertical =
                jogadorMaxY > c.minY + 0.03 && jogadorMinY < c.maxY - 0.02;
            if (!sobrepoeVertical) return false;

            return (
                x + raioColisao > c.minX &&
                x - raioColisao < c.maxX &&
                z + raioColisao > c.minZ &&
                z - raioColisao < c.maxZ
            );
        });
    }

    if (frente !== 0) {
        const proximoX = jogador.position.x + alvoX * dt;
        const proximoZ = jogador.position.z + alvoZ * dt;

        // Tenta mover no eixo X; se houver parede, bloqueia apenas esse eixo.
        if (!colideComCenario(proximoX, jogador.position.y, jogador.position.z)) {
            jogador.position.x = proximoX;
        }

        // Tenta mover no eixo Z usando a posição X já corrigida.
        if (!colideComCenario(jogador.position.x, jogador.position.y, proximoZ)) {
            jogador.position.z = proximoZ;
        }
    }

    jogador.rotation.y = direcao;

    // Pulo com a tecla espaço
    const espaco = !!teclas["Space"];

    if (espaco && !espacoAnterior && noChao) {
        velocidadeY = 8.4;
        noChao = false;
        mostrarMensagem("Salto!");
    }

    espacoAnterior = espaco;

    // Gravidade
    velocidadeY -= 20 * dt;
    jogador.position.y += velocidadeY * dt;

    // Altura aproximada das plataformas
    let alturaChao = 0;

    const x = jogador.position.x;
    const z = jogador.position.z;

    if (x > -24 && x < -10 && z > -9.8 && z < -4.2) {
        alturaChao = 0.82;
    }

    if (x > -4.5 && x < 6.5 && z > -15.8 && z < -10.2) {
        alturaChao = 0.86;
    }

    if (x > 3 && x < 11 && z > -3.5 && z < 3.5) {
        alturaChao = 3.62;
    }

    // Impede que o jogador atravesse o chão
    if (jogador.position.y <= alturaChao) {
        jogador.position.y = alturaChao;
        velocidadeY = 0;
        noChao = true;
    }

    // Limites da arena
    jogador.position.x = THREE.MathUtils.clamp(
        jogador.position.x, -46, 46
    );

    jogador.position.z = THREE.MathUtils.clamp(
        jogador.position.z, -25.5, 25.5
    );

    // Girar as rodas quando a bicicleta se movimenta
    const movimento = Math.abs(frente) * dt * 5;

    rodaDianteira.rotation.x += movimento;
    rodaTraseira.rotation.x += movimento;

    // Esferas flutuantes
    esferas.forEach(e => {
        if (e.coletada) return;

        e.grupo.position.y =
            e.altura + Math.sin(relogio.elapsedTime * 2 + e.fase) * 0.2;

        e.grupo.rotation.y += dt;

        // Detectar coleta
        if (jogador.position.distanceTo(e.grupo.position) < 1.5) {
            e.coletada = true;
            e.grupo.visible = false;

            pontos++;
            pontuacaoHTML.textContent = pontos;

            if (pontos === 12) {
                mostrarMensagem("🏆 Você coletou todas as esferas!");
            } else {
                mostrarMensagem("Esfera coletada! " + pontos + "/12");
            }
        }
    });

    velocidadeHTML.textContent =
        Math.round(Math.abs(frente) * velocidade * 3.6);

    // Esconder mensagens depois de um tempo
    if (mensagemTempo > 0) {
        mensagemTempo -= dt;

        if (mensagemTempo <= 0) {
            mensagemHTML.style.opacity = 0;
        }
    }

    // Câmera acompanha a bicicleta por trás
    const deslocamentoCamera = new THREE.Vector3(
        Math.sin(direcao) * 8,
        4.2,
        Math.cos(direcao) * 8
    );

    const cameraAlvo = jogador.position.clone()
        .add(deslocamentoCamera);

    camera.position.lerp(
        cameraAlvo,
        1 - Math.pow(0.001, dt)
    );

    const olhar = jogador.position.clone();
    olhar.y += 1.1;

    camera.lookAt(olhar);

    renderizador.render(cena, camera);
}

// ==================================================
// CONTROLES DO TECLADO
// ==================================================

document.addEventListener("keydown", evento => {
    teclas[evento.code] = true;

    if ([
        "Space",
        "ArrowUp",
        "ArrowDown",
        "ArrowLeft",
        "ArrowRight"
    ].includes(evento.code)) {
        evento.preventDefault();
    }
});

document.addEventListener("keyup", evento => {
    teclas[evento.code] = false;
});

// Botão iniciar
document.getElementById("iniciar").addEventListener("click", () => {
    iniciado = true;
    document.getElementById("telaInicial").style.display = "none";

    mostrarMensagem("Use WASD ou as setas para pedalar!");
});

// Executar o jogo
iniciarMotor();
</script>
